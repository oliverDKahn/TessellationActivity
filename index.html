<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Choose a Shape</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap">
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<main class="shape-choices" aria-label="Choose a shape">
			<h1>Choose a shape!</h1>
			<div class="shape-row">
				<a class="shape-button" href="triangle.html" aria-label="Choose triangle">
					<img src="triangle.png" alt="Triangle">
				</a>
				<a class="shape-button" href="square.html" aria-label="Choose square">
					<img src="square.png" alt="Square">
				</a>
				<a class="shape-button" href="hexagon.html" aria-label="Choose hexagon">
					<img src="hexagon.png" alt="Hexagon">
				</a>
			</div>
		</main>
	</body>
</html>
