<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Choose a Shape</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<main class="shape-choices" aria-label="Choose a shape">
			<a class="shape-button" href="#triangle" aria-label="Choose triangle">
				<img src="triangle.png" alt="Triangle">
			</a>
			<a class="shape-button" href="#square" aria-label="Choose square">
				<img src="square.png" alt="Square">
			</a>
			<a class="shape-button" href="#hexagon" aria-label="Choose hexagon">
				<img src="hexagon.png" alt="Hexagon">
			</a>
		</main>
	</body>
</html>
